# Optional Render service: panel API only (FREE — sleeps when idle).
# Your 24/7 Discord bot runs on Oracle Cloud / VPS — see deploy/install-oracle.sh
# Paid all-in-one on Render instead: use render-starter.yaml
services:
  - type: web
    name: orbat-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-panel.txt
    startCommand: python run_panel.py
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PANEL_ADMIN_USERNAME
        sync: false
      - key: PANEL_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: POST_LOGIN_REDIRECT
        sync: false
