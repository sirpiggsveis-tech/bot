# Render blueprint: Discord bot + panel API together, 24/7 (no PC required).
#
# IMPORTANT: The Discord bot needs a plan that does NOT sleep.
#   - Starter ($7/mo): always on — recommended
#   - Free: panel API only (bot will NOT stay online) — use HOSTING_24_7.txt for free VM options
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: orbat-bot
    runtime: python
    plan: starter # always on — required for 24/7 Discord bot
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PANEL_ADMIN_USERNAME
        sync: false
      - key: PANEL_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: POST_LOGIN_REDIRECT
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
