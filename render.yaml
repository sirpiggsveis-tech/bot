# Render blueprint: one web service running the Discord bot + control-panel API.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: orbat-bot
    runtime: python
    plan: free # sleeps when idle; fine for admin panel (wakes on first visit)
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20"
      # Set all of these as secrets in the Render dashboard (do not commit them):
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PANEL_ADMIN_USERNAME
        sync: false
      - key: PANEL_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
